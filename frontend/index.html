<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="supported-color-schemes" content="dark light" />
    <meta name="theme-color" content="#090909" />
    <script>
      (function () {
        try {
          var themeVersion = "4";
          var theme = localStorage.getItem("lace-theme");
          if (localStorage.getItem("lace-theme-version") !== themeVersion) {
            theme = "dark";
            localStorage.setItem("lace-theme", theme);
            localStorage.setItem("lace-theme-version", themeVersion);
          }
          if (theme !== "dark" && theme !== "light") theme = "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.remove("theme-light", "theme-dark");
          document.documentElement.classList.add("theme-" + theme);
          document.documentElement.style.colorScheme = theme === "light" ? "only light" : "dark";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.classList.add("theme-dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <title>LACE - Laboratório de Agenciamentos Cotidianos e Experiências</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
